# Local development + test Postgres only. Production Postgres is managed by Railway
# in the same project (private networking, Singapore region) — see SYSTEM_DESIGN.md D-006.
services:
  postgres:
    image: postgres:16-alpine
    container_name: jee-postgres
    environment:
      POSTGRES_USER: jee
      POSTGRES_PASSWORD: jee
      POSTGRES_DB: jee
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jee -d jee']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - jee-pgdata:/var/lib/postgresql/data

volumes:
  jee-pgdata:
