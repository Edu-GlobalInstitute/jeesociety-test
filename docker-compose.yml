# Local development + test Postgres only. Production Postgres is a Neon branch in
# ap-southeast-1 — see SYSTEM_DESIGN.md D-006 and deploy/neon.md. Keep this image's
# major version in step with Neon's (17) so local runs and the event run the same
# planner. Bumping the image major needs the old volume thrown away first:
#   docker compose down -v && pnpm db:up && pnpm migrate && pnpm seed
services:
  postgres:
    image: postgres:17-alpine
    container_name: jee-postgres
    environment:
      POSTGRES_USER: jee
      POSTGRES_PASSWORD: jee
      POSTGRES_DB: jee
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jee -d jee']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - jee-pgdata:/var/lib/postgresql/data

volumes:
  jee-pgdata:
