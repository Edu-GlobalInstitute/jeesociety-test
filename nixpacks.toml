# Railway build configuration.
#
# postgresql is here for `pg_dump` only: the worker's backup job shells out to
# it every 15 minutes. Without it the worker boots fine and silently takes no
# backups, so it is installed for both services rather than relying on a
# per-service override that someone will forget.
[phases.setup]
nixPkgs = ['nodejs_20', 'postgresql_16']

[phases.install]
cmds = ['corepack enable && pnpm install --frozen-lockfile']

[phases.build]
cmds = ['pnpm -r --filter @jee/shared --filter @jee/db --filter @jee/api --filter @jee/worker build']
