# Render blueprint for the API.
#
# Phase 1 only: the public funnel (landing page, sign-up, sign-in, payment in
# Razorpay test mode). The site itself is on Cloudflare Pages; this is the
# Express API from apps/api.
#
# Not here, deliberately:
#   - the `worker` service. It does auto-submit, scoring and backups, none of
#     which have anything to act on before a paper exists.
#   - a database. Postgres is a Neon branch in ap-southeast-1 (deploy/neon.md),
#     not a Render instance, so nothing here provisions one.
#
# On the free plan this service sleeps after 15 minutes idle and the next
# request pays ~30-60s to wake it. That is acceptable while the site is only
# taking early registrations and is NOT acceptable for the event: at 25,000
# students the exam hour needs roughly 4 replicas of 2 vCPU / 2 GB (see
# deploy/railway.md for the sizing). Move off free before the paper opens.

services:
  - type: web
    name: jee-api
    runtime: node
    plan: free
    # Singapore. Neon's branch is in ap-southeast-1 and the API makes several
    # queries per request, so a region on another continent taxes all of them.
    region: singapore
    branch: main

    # pnpm, not npm: this is a workspace monorepo and `npm install` resolves
    # the workspace: protocol differently, producing a tree that builds and
    # then fails at runtime. --frozen-lockfile makes a drifted lockfile a build
    # failure rather than a silent version change.
    #
    # Two things here are deliberate and both were failures first:
    #
    #   npx pnpm@9.15.4, not `corepack enable && pnpm`. Corepack has to write a
    #   shim into the Node install directory, which fails on a build image
    #   where that path is not writable -- and it fails at the first command,
    #   so nothing after it runs. npx fetches the same pinned version and needs
    #   no write access.
    #
    #   NODE_ENV=development for the install only. tsc is a devDependency, and
    #   pnpm omits devDependencies when NODE_ENV=production -- which is exactly
    #   what this service sets, so the compiler would be missing from the one
    #   command that needs it. The runtime still runs as production: NODE_ENV
    #   is read from the service environment at boot, not from this line.
    buildCommand: >-
      NODE_ENV=development npx --yes pnpm@9.15.4 install --frozen-lockfile &&
      npx --yes pnpm@9.15.4 -r --filter @jee/shared --filter @jee/db --filter @jee/api build
    startCommand: node apps/api/dist/server.js

    # Touches the database: an API that cannot reach Postgres is not ready to
    # take a student's registration. /health answers without querying.
    healthCheckPath: /ready

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PG_POOL_MAX
        # Small on purpose: the free instance has 512 MB, and Neon's pooler
        # multiplexes anyway, so a large pool here buys nothing and costs RAM.
        value: "5"
      - key: TRUST_PROXY_HOPS
        # TWO hops now, not one: the browser reaches Cloudflare, the Pages
        # Function forwards to Render, and Render's edge forwards to this
        # process. Each appends to X-Forwarded-For.
        #
        # This was 1, which was right while browsers called Render directly.
        # After the same-origin proxy went in it meant Express read the proxy's
        # address instead of the student's -- so every user in the country
        # shared one rate-limit bucket of ten requests a minute, and signing in
        # answered "Too Many Requests" to people who had tried once.
        #
        # Still never `true`. Trusting every hop lets a client forge
        # X-Forwarded-For and pick whichever bucket it likes, which is the
        # rate limiter switched off.
        value: "2"
      - key: SERVE_LOCAL_PAPERS
        value: "false"
      - key: CORS_ORIGINS
        value: https://test.jeesociety.in
      - key: WEB_ORIGIN
        # Must be one of CORS_ORIGINS; the API refuses to boot otherwise,
        # because a wrong value here redirects a student carrying a live
        # session to an origin we do not control.
        value: https://test.jeesociety.in

      # Set by hand in the Render dashboard, never committed:
      #   DATABASE_URL             Neon POOLED  (hostname contains -pooler)
      #   DATABASE_URL_UNPOOLED    Neon DIRECT  (same hostname, no -pooler)
      #   BETTER_AUTH_SECRET       32+ random chars; rotating it signs out every
      #                            student, so set it once
      #   BETTER_AUTH_URL          https://<this service's own render.com host>
      #   RAZORPAY_KEY_ID
      #   RAZORPAY_KEY_SECRET
      #   RAZORPAY_WEBHOOK_SECRET  a string you invent; the same one goes in
      #                            Razorpay's dashboard
      #
      # There are no social-provider variables. Email and password is the only
      # way in; see apps/api/src/auth.ts. Any GOOGLE_CLIENT_ID or
      # GOOGLE_CLIENT_SECRET left in the dashboard is now ignored and should be
      # deleted so it cannot look like a live configuration.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: ADMIN_BOOTSTRAP_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # ──────────────────────────────────────────────────────────────────────────
  # The worker.
  #
  # Absent until now, which meant three things nobody had noticed were not
  # happening:
  #
  #   auto-submit. A student who closes their laptop at 11:58 is never
  #   submitted at all, because nothing finalises an attempt when the window
  #   shuts. Their paper simply stays in progress and scores nothing.
  #
  #   scoring. mcq_score is what turns answers into marks. Without it there is
  #   no result to release, and running it inside an HTTP request would time out
  #   behind Render's proxy long before 25,000 attempts were scored.
  #
  #   payment reconciliation. A captured payment whose webhook never arrived
  #   stays `created` for ever, so a student who paid is told they have not.
  #   This is one cause of "I paid and it is not showing".
  #
  # It is a background worker, not a web service: no port, no health check, no
  # inbound traffic. It claims jobs from `job_runs` with FOR UPDATE SKIP LOCKED,
  # so running more than one replica is safe — but one is enough, and a second
  # only adds ways to be surprised.
  - type: worker
    name: jee-worker
    runtime: node
    # Starter, not free: Render's free tier has no worker type, and this process
    # must be awake at 12:00 on exam day whether or not anyone has made a
    # request. A sleeping scorer is the same as no scorer.
    plan: starter
    region: singapore
    branch: main

    buildCommand: >-
      NODE_ENV=development npx --yes pnpm@9.15.4 install --frozen-lockfile &&
      npx --yes pnpm@9.15.4 -r --filter @jee/shared --filter @jee/db --filter @jee/worker build
    startCommand: node apps/worker/dist/worker.js

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PG_POOL_MAX
        # Smaller than the API's: this process runs a handful of queries at a
        # time, and the exam hour needs the pooler's connections for students.
        value: "4"
      - key: WORKER_JOBS
        # The three continuous loops. Scoring is not listed because it is not a
        # loop: mcq_score is claimed from job_runs when the admin schedules it
        # or when a test closes, which is what makes it re-runnable after an
        # answer-key correction.
        value: autosubmit,flags,payments
      - key: POLL_INTERVAL_MS
        value: "5000"

      # Note what WORKER_JOBS above does NOT contain: `backup`. That loop shells
      # out to pg_dump, which is not on Render's Node image, and Neon takes its
      # own backups anyway. Adding it without a pg_dump binary logs
      # "BACKUPS DISABLED" and takes none, which is worse than deciding not to.

      # Set by hand, the same values as jee-api. The reconciler calls Razorpay
      # to ask what really happened to a stuck payment, so it needs the keys.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
